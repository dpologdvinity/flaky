name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release archives, packages, and checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/checksums.txt

      - name: Verify published release attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          download_dir=$(mktemp -d)
          trap 'rm -rf "$download_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$download_dir" --pattern '*.tar.gz' --pattern '*.zip' \
            --pattern '*.deb' --pattern 'checksums.txt'
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners --bundle "$ATTESTATION_BUNDLE"
          }
          for artifact in "$download_dir"/*; do
            verify "$artifact"
          done
          printf '\ntampered\n' >> "$download_dir/checksums.txt"
          if verify "$download_dir/checksums.txt"; then
            echo 'Error: verification accepted a modified artifact' >&2
            exit 1
          fi

  homebrew:
    name: Update Homebrew Tap
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - name: Checkout tap repository
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: dpologdvinity/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update Formula
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          repo="${GITHUB_REPOSITORY}"

          sums=$(curl --retry 5 --retry-delay 5 -fsSL "https://github.com/${repo}/releases/download/${tag}/checksums.txt")
          sum() { echo "$sums" | awk -v f="flaky_${ver}_$1.tar.gz" '$2==f {print $1}'; }
          url() { echo "https://github.com/${repo}/releases/download/${tag}/flaky_${ver}_$1.tar.gz"; }

          darwin_arm64_sha=$(sum darwin_arm64)
          darwin_amd64_sha=$(sum darwin_amd64)
          linux_arm64_sha=$(sum linux_arm64)
          linux_amd64_sha=$(sum linux_amd64)

          for sha in "$darwin_arm64_sha" "$darwin_amd64_sha" "$linux_arm64_sha" "$linux_amd64_sha"; do
            if [ -z "$sha" ] || [ ${#sha} -ne 64 ]; then
              echo "Error: invalid or missing sha256 checksum: '$sha'" >&2
              exit 1
            fi
          done

          mkdir -p tap/Formula
          cat > tap/Formula/flaky.rb <<EOF
          # Generated by flaky release workflow; do not edit by hand.
          class Flaky < Formula
            desc "Offline CLI to rank intermittent test failures and bisect their introduction"
            homepage "https://github.com/${repo}"
            version "${ver}"
            license "MIT"

            on_macos do
              on_arm do
                url "$(url darwin_arm64)"
                sha256 "${darwin_arm64_sha}"
              end
              on_intel do
                url "$(url darwin_amd64)"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              on_arm do
                url "$(url linux_arm64)"
                sha256 "${linux_arm64_sha}"
              end
              on_intel do
                url "$(url linux_amd64)"
                sha256 "${linux_amd64_sha}"
              end
            end

            def install
              bin.install "flaky"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/flaky --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flaky.rb
          if ! git diff --staged --quiet; then
            git commit -m "feat: update flaky to ${ver}"
            git push
          fi
