version: 2
builds:
  - id: flaky
    main: ./cmd/flaky
    binary: flaky
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/dpologdvinity/flaky/internal/flaky.Version={{.Version}}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
nfpms:
  - package_name: flaky
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/dpologdvinity/flaky
    maintainer: Kaitlyn Bassford <kaitlynbassford@gmail.com>
    description: Offline CLI to rank intermittent test failures and bisect their introduction
    license: MIT
    section: utils
    priority: optional
    formats: [deb]
    suggests: [git]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/flaky/copyright
